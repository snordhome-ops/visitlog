<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nord Home Sales Desk</title>
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="login" class="login" hidden>
  <div class="brand">
    <img src="/logo.png" alt="Nord Home">
    <div>
      <h2>Every visit and quotation, in one place.</h2>
      <p>Log walk-in clients, send daily reports to management and issue quotations from the same desk.</p>
    </div>
    <span class="note" style="color:#8f887b">Lahore · Islamabad · Karachi</span>
  </div>
  <div class="formside">
    <form id="lform" autocomplete="on">
      <div><h1>Sign in</h1><p class="small" style="margin-top:6px">Use the email and password your administrator gave you.</p></div>
      <div id="lmsg" class="msg" hidden role="alert"></div>
      <label class="field">Email<input id="lemail" type="email" autocomplete="username" inputmode="email" required></label>
      <label class="field">Password<span class="pw"><input id="lpass" type="password" autocomplete="current-password" required><button type="button" id="lshow" aria-label="Show password">Show</button></span></label>
      <button class="btn primary" id="lgo" type="submit" style="padding:11px">Sign in</button>
      <p class="small">Forgot your password? Ask your administrator to reset it.</p>
    </form>
  </div>
</div>

<div id="shell" class="shell" hidden>
  <aside class="side">
    <img class="logo" src="/logo.png" alt="Nord Home">
    <nav id="nav" aria-label="Main"></nav>
    <div class="who"><b id="whoEmail"></b><span id="whoRole"></span><button id="logout">Sign out</button></div>
  </aside>
  <div>
    <div class="mobtop"><img src="/logo.png" alt="Nord Home"><button id="logout2">Sign out</button></div>
    <main class="main">
      <section class="view" id="v-dashboard" hidden></section>
      <section class="view" id="v-report" hidden></section>
      <section class="view" id="v-visits" hidden></section>
      <section class="view" id="v-quotes" hidden></section>
    </main>
  </div>
  <nav class="mobnav" id="mobnav" aria-label="Main"></nav>
</div>

<dialog id="vdlg" aria-labelledby="vdlgT"></dialog>
<div id="toast" class="toast" hidden role="status"></div>

<script src="/charts.js"></script>
<script src="/quote.js"></script>
<script src="/app.js"></script>
</body>
</html>
